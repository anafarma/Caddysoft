name: Caddysoft Authenticated E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Vercel Preview URL to test"
        required: true
        type: string
  deployment_status:

permissions:
  contents: read

jobs:
  authenticated-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url || github.event.deployment_status.target_url }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Validate E2E configuration
        run: |
          test -n "$E2E_BASE_URL" || { echo "Missing E2E_BASE_URL"; exit 1; }
          test -n "$E2E_CLERK_USER_EMAIL" || { echo "Missing GitHub secret E2E_CLERK_USER_EMAIL"; exit 1; }
          test -n "$CLERK_PUBLISHABLE_KEY" || { echo "Missing GitHub secret CLERK_PUBLISHABLE_KEY"; exit 1; }
          test -n "$CLERK_SECRET_KEY" || { echo "Missing GitHub secret CLERK_SECRET_KEY"; exit 1; }
          echo "Testing $E2E_BASE_URL"

      - uses: actions/checkout@v4
        with:
          ref: agent-stabilization-2026-09-14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated E2E
        run: npm run test:e2e
